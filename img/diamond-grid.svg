<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 620 280" fill="none">
  <defs>
    <!-- Seamless 2:1 isometric diamond blueprint pattern -->
    <pattern id="isoDiamond" width="72" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 0 L72 36 M0 36 L72 0" stroke="#94a3b8" stroke-opacity="0.32" stroke-width="1" />
    </pattern>

    <!-- Concentrated top-right fade mask: completely 0 opacity at top (y<=30), bottom (y>=230), and left (x<=190) -->
    <radialGradient id="topRightPillowFade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(430, 130) scale(240, 100)">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="gridMask">
      <rect width="100%" height="100%" fill="url(#topRightPillowFade)" />
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="url(#isoDiamond)" mask="url(#gridMask)" />
</svg>
